        <!-- Error suppression must run BEFORE external scripts -->
        <script>
            (function() {
                'use strict';
                
                // Intercept WebSocket FIRST before anything else
                const OriginalWebSocket = window.WebSocket;
                
                // Use Proxy to intercept WebSocket constructor calls
                const WebSocketProxy = new Proxy(OriginalWebSocket, {
                    construct: function(target, args) {
                        const url = args[0];
                        // Block localhost:443 connections immediately
                        if (url && typeof url === 'string' && url.includes('localhost:443')) {
                            // Return a completely silent mock
                            const mock = {
                                readyState: 3,
                                url: url,
                                protocol: '',
                                extensions: '',
                                binaryType: 'blob',
                                bufferedAmount: 0,
                                close: function() {},
                                send: function() {},
                                addEventListener: function() {},
                                removeEventListener: function() {},
                                dispatchEvent: function() { return true; },
                                CONNECTING: 0,
                                OPEN: 1,
                                CLOSING: 2,
                                CLOSED: 3
                            };
                            Object.defineProperty(mock, 'onopen', { value: null, writable: true });
                            Object.defineProperty(mock, 'onclose', { value: null, writable: true });
                            Object.defineProperty(mock, 'onerror', { value: null, writable: true });
                            Object.defineProperty(mock, 'onmessage', { value: null, writable: true });
                            return mock;
                        }
                        // For other URLs, use original WebSocket
                        return new target(...args);
                    }
                });
                
                // Create a patched constructor that delegates to the proxy
                function PatchedWebSocket(...args) {
                    return new WebSocketProxy(...args);
                }
                
                PatchedWebSocket.prototype = OriginalWebSocket.prototype;
                
                ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function(prop) {
                    Object.defineProperty(PatchedWebSocket, prop, {
                        configurable: true,
                        enumerable: true,
                        get: function() {
                            return OriginalWebSocket[prop];
                        }
                    });
                });
                
                // Replace global WebSocket
                Object.defineProperty(window, 'WebSocket', {
                    configurable: true,
                    writable: true,
                    value: PatchedWebSocket
                });
                
                // Comprehensive console error/warn suppression
                const originalError = console.error;
                const originalWarn = console.warn;
                const originalLog = console.log;
                const originalDir = console.dir;
                const originalTrace = console.trace;
                const originalInfo = console.info;
                
                // Helper function to check if message should be suppressed
                function shouldSuppress(args) {
                    if (!args || args.length === 0) return false;
                    const allMessages = args.map(String).join(' ').toLowerCase();
                    const firstMsg = String(args[0] || '').toLowerCase();
                    
                    // Check for WebSocket errors (case insensitive)
                    if (allMessages.includes('websocket connection to') ||
                        allMessages.includes('ws://localhost:443') ||
                        allMessages.includes('websocketclient') ||
                        allMessages.includes('websocketclient.js') ||
                        firstMsg.includes('websocket connection to') ||
                        firstMsg.includes('ws://localhost:443') ||
                        firstMsg.includes('websocketclient')) {
                        return true;
                    }
                    
                    // Check for tracking prevention
                    if (allMessages.includes('tracking prevention blocked access to storage') ||
                        firstMsg.includes('tracking prevention blocked access to storage')) {
                        return true;
                    }
                    
                    return false;
                }
                
                // Override all console methods that might log errors
                console.error = function(...args) {
                    if (shouldSuppress(args)) return;
                    originalError.apply(console, args);
                };
                
                console.warn = function(...args) {
                    if (shouldSuppress(args)) return;
                    originalWarn.apply(console, args);
                };
                
                console.log = function(...args) {
                    if (shouldSuppress(args)) return;
                    originalLog.apply(console, args);
                };
                
                console.dir = function(...args) {
                    if (shouldSuppress(args)) return;
                    originalDir.apply(console, args);
                };
                
                console.trace = function(...args) {
                    if (shouldSuppress(args)) return;
                    originalTrace.apply(console, args);
                };
                
                console.info = function(...args) {
                    if (shouldSuppress(args)) return;
                    originalInfo.apply(console, args);
                };
                
                // Use MutationObserver to catch console messages that bypass our overrides
                if (window.console && console.log) {
                    const observer = new MutationObserver(function(mutations) {
                        // This catches messages that might be logged directly by the browser
                        // Note: This is a fallback, the main suppression is above
                    });
                    
                    // Observe console if possible (some browsers don't allow this)
                    try {
                        observer.observe(document.body, {
                            childList: true,
                            subtree: true
                        });
                    } catch(e) {
                        // Ignore if observation fails
                    }
                }
                
                
                // Global error handlers to catch any remaining errors
                window.addEventListener('error', function(event) {
                    const errorMsg = String(event.message || '');
                    if (errorMsg.includes('WebSocket connection to') ||
                        errorMsg.includes('ws://localhost:443') ||
                        errorMsg.includes('WebSocketClient')) {
                        event.preventDefault();
                        event.stopPropagation();
                        return false;
                    }
                }, true);
                
                window.addEventListener('unhandledrejection', function(event) {
                    const reason = String(event.reason || '');
                    if (reason.includes('WebSocket connection to') ||
                        reason.includes('ws://localhost:443') ||
                        reason.includes('WebSocketClient')) {
                        event.preventDefault();
                        return false;
                    }
                });
            })();
        </script>
